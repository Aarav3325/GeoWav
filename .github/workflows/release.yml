name: Android Release Pipeline

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d -i > keystore/keystore

      - name: Create local.properties
        run: |
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > local.properties
          echo "META_ACCESS_TOEKN=${{ secrets.META_ACCESS_TOEKN }}" >> local.properties
          echo "REVENUE_CAT_API_KEY=${{ secrets.REVENUE_CAT_API_KEY }}" >> local.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build Release AAB
        env:
          KEYSTORE_PATH: "keystore/keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Verify AAB exists
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ AAB not found!"
            exit 1
          fi

          echo "✅ AAB found"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install Fastlane
        run: |
          gem install fastlane -NV

      - name: Deploy to Play Store
        continue-on-error: true
        env:
          PLAY_JSON_KEY_DATA: ${{ secrets.PLAY_JSON_KEY_DATA }}
        run: |

          if [ -z "$PLAY_JSON_KEY_DATA" ]; then
            echo "Skipping Play Store deployment."
            exit 0
          fi

          TRACK="${{ github.event.inputs.track || 'internal' }}"

          echo "Deploying to track: $TRACK"

          case $TRACK in
            internal) fastlane deploy_internal ;;
            alpha) fastlane deploy_alpha ;;
            beta) fastlane deploy_beta ;;
            production) fastlane deploy_production ;;
            *) fastlane deploy_internal ;;
          esac

      - name: Build Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Release Triggered By Tag" >> $GITHUB_STEP_SUMMARY
          echo "- Signed AAB Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Release Created" >> $GITHUB_STEP_SUMMARY