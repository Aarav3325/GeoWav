name: Android CI/CD - Build Only

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build-test:
    if: "!contains(github.event.head_commit.message, '[skip-build]')"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/keystore

      - name: Verify Keystore Integrity
        run: |
          echo "Keystore file size: $(wc -c < keystore/keystore) bytes (expected: 2724)"
          echo "SHA256: $(sha256sum keystore/keystore | cut -d' ' -f1)"
          echo "Expected SHA256: 09005e44a03b8100e10bd4f4cf105a659bece56a613936f1dd00e27bbb61096f"
          if [ "$(wc -c < keystore/keystore)" -ne 2724 ]; then
            echo "❌ ERROR: Keystore file size mismatch! File is likely corrupted."
            exit 1
          fi
          echo "✅ Keystore file size matches"

      - name: Read current version
        id: version
        run: |
          # Read current version from app/build.gradle.kts
          CURRENT_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          CURRENT_VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION="1.0.0"
            echo "Fallback version: $CURRENT_VERSION"
          fi
          
          if [ -z "$CURRENT_VERSION_CODE" ]; then
            CURRENT_VERSION_CODE=0
            echo "Fallback version code: $CURRENT_VERSION_CODE"
          fi
          
          echo "VERSION_CODE=$CURRENT_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Using version code: $CURRENT_VERSION_CODE"
          echo "Using version name: $CURRENT_VERSION"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: |
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > local.properties
          echo "META_ACCESS_TOEKN=${{ secrets.META_ACCESS_TOEKN }}" >> local.properties
          echo "REVENUE_CAT_API_KEY=${{ secrets.REVENUE_CAT_API_KEY }}" >> local.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Verify Keystore Credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Testing keystore with provided credentials..."
          echo "KEY_ALIAS value: $KEY_ALIAS"
          echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
          echo "KEY_PASSWORD length: ${#KEY_PASSWORD}"
          keytool -list -keystore keystore/keystore -storepass "$KEYSTORE_PASSWORD" -v 2>&1 | head -20 || echo "❌ Store password is WRONG"
          echo "---"
          keytool -keypasswd -keystore keystore/keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -new "$KEY_PASSWORD" 2>&1 || echo "❌ Key password or alias is WRONG"

      - name: Build AAB
        env:
          KEYSTORE_PATH: "keystore/keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Verify AAB exists
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ AAB not found!"
            find app/build/outputs -name "*.aab" || true
            exit 1
          fi
          echo "✅ AAB found: $AAB_PATH"
          ls -lh "$AAB_PATH"

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.VERSION_CODE }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code**: ${{ steps.version.outputs.VERSION_CODE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Name**: ${{ steps.version.outputs.VERSION_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Build successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The AAB artifact has been uploaded and can be downloaded from the workflow run." >> $GITHUB_STEP_SUMMARY

      - name: Notify build status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Build successful"
            echo "Version: ${{ steps.version.outputs.VERSION_NAME }}"
            echo "Download AAB from workflow artifacts"
          else
            echo "❌ Build failed"
            echo "Check workflow logs for details"
            exit 1
          fi